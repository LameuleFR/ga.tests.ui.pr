; CI-only PHP tuning, loaded after the base image's php.ini.
; Timestamps stay validated: cache files and modules are rewritten while the tests run.

; ~24k source files + one compiled container per kernel, rebuilt after each module action:
; the base image limits (256 MB / 20000 files) force full opcache restarts mid-campaign.
opcache.memory_consumption=512
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=100000
opcache.max_wasted_percentage=20

; Module actions spawn bin/console cache:clear/warmup processes: let them reuse compiled code.
opcache.enable_cli=1
opcache.file_cache=/tmp/opcache
