# One isolated PrestaShop stack, independent from the PrestaShop version's own compose file
# (9.2.x hard-codes its ports and network name). Every lane of a job runs one copy of it
# under its own project name (-p), ports, network and RAM datadir.
#
# Required env: LANE_DIR (shop sources), DB_SERVER (mysql|mariadb), DB_IMAGE, DB_FLAGS,
# HTTP_HOST_PORT, HTTPS_HOST_PORT, NETWORK_NAME, DB_DATADIR, CI_FAST_DIR, PHP_VERSION.
services:
  db:
    image: ${DB_IMAGE}
    # The shop reaches its database through the DB_SERVER host name (mysql or mariadb),
    # which is also what parameters.php holds after the install.
    networks:
      default:
        aliases:
          - ${DB_SERVER}
    # Throwaway database: no durability, no binlog, no performance_schema, datadir in RAM.
    command: ${DB_FLAGS}
    environment:
      MYSQL_ROOT_PASSWORD: prestashop
      MYSQL_DATABASE: prestashop
      MYSQL_INITDB_SKIP_TZINFO: '1'
      MARIADB_ROOT_PASSWORD: prestashop
      MARIADB_DATABASE: prestashop
      MARIADB_INITDB_SKIP_TZINFO: '1'
    volumes:
      - ${DB_DATADIR}:/var/lib/mysql
    ports:
      # Only lane 0 needs it: two tests connect to localhost:3306 from the host.
      - ${DB_HOST_PORT:-127.0.0.1:0}:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -pprestashop --silent || mariadb-admin ping -h 127.0.0.1 --protocol=tcp -uroot -pprestashop --silent"]
      interval: 1s
      timeout: 2s
      retries: 180
    stop_grace_period: 60s

  prestashop-git:
    image: ps-ci-shop:local
    build:
      context: ${LANE_DIR}
      dockerfile: .docker/Dockerfile
      args:
        - VERSION=${PHP_VERSION}-apache
        - USER_ID=${USER_ID:-1001}
        - GROUP_ID=${GROUP_ID:-118}
        - NODE_VERSION=${NODE_VERSION:-20.19.5}
        - INSTALL_XDEBUG=false
        - TIMEZONE=Europe/Paris
    hostname: localhost
    depends_on:
      db:
        condition: service_healthy
    command: /tmp/docker_run_git.sh
    environment:
      DISABLE_MAKE: '1'
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-0}
      DB_SERVER: ${DB_SERVER}
      DB_PASSWD: prestashop
      DB_NAME: prestashop
      DB_PREFIX: tst_
      DB_USER: root
      PS_DOMAIN: localhost:${HTTPS_HOST_PORT}
      PS_FOLDER_INSTALL: install-dev
      PS_FOLDER_ADMIN: admin-dev
      PS_COUNTRY: fr
      PS_LANGUAGE: en
      PS_DEV_MODE: ${PS_DEV_MODE:-0}
      PS_ENABLE_SSL: '1'
      PS_ERASE_DB: '0'
      PS_USE_DOCKER_MAILDEV: '0'
      ADMIN_MAIL: demo@prestashop.com
      ADMIN_PASSWD: Pr3st4Sh0P
      BLACKFIRE_ENABLE: '0'
    ports:
      - ${HTTP_HOST_PORT}:80
      - ${HTTPS_HOST_PORT}:443
    volumes:
      - ${LANE_DIR}:/var/www/html
      - ${CI_FAST_DIR}/php/zz-ci-perf.ini:/usr/local/etc/php/conf.d/zz-ci-perf.ini:ro
      - ${CI_FAST_DIR}/apache/zz-ci-perf.conf:/etc/apache2/conf-enabled/zz-ci-perf.conf:ro
    tmpfs:
      - /tmp/opcache:mode=1777

networks:
  default:
    name: ${NETWORK_NAME}
