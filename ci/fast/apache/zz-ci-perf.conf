# CI-only Apache tuning, included after mods-enabled.

# Browser and server share the runner: gzipping multi-MB bundles over localhost only burns CPU.
SetEnv no-gzip 1

# Fewer TLS handshakes between test steps.
KeepAliveTimeout 30

# Keep enough idle children for page loads that fire many parallel asset/AJAX requests.
<IfModule mpm_prefork_module>
    StartServers 10
    MinSpareServers 10
    MaxSpareServers 20
</IfModule>

# Per-request duration (microseconds), uploaded with the job artifacts. lanes.sh reads the time
# ($1, $2), the request ($3, $4), the Host header (next to last) and the duration (last field).
LogFormat "%t \"%r\" %>s %b %{Host}i %D" ci_timing
CustomLog /var/www/html/var/logs/apache-timing.log ci_timing
